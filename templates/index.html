<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Пиксельный Тамагочи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e; color: #eee;
      font-family: 'Courier New', monospace;
      text-align: center; padding: 16px;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #select-screen h2 { margin-bottom: 16px; font-size: 20px; }
    .pets-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; max-width: 360px; margin: 0 auto;
    }
    .pet-card {
      background: #16213e; border: 3px solid #0f3460;
      border-radius: 14px; padding: 8px;
      cursor: pointer; transition: border-color 0.2s, transform 0.2s;
    }
    .pet-card:hover, .pet-card.selected {
      border-color: #e94560; transform: scale(1.03);
    }
    .pet-card svg { width: 100%; height: auto; image-rendering: pixelated; }
    .pet-card h3 { font-size: 13px; margin-top: 4px; }
    #game-screen {
      display: none; flex-direction: column;
      align-items: center; width: 100%;
    }
    .coins {
      font-size: 18px; margin-bottom: 12px; color: #ffd700;
      display: flex; align-items: center; gap: 8px;
    }
    .pet-container {
      background: #16213e; border: 4px solid #0f3460;
      border-radius: 16px; padding: 16px;
      margin-bottom: 16px;
    }
    .pet-container svg { display: block; image-rendering: pixelated; }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; width: 100%; max-width: 340px;
      margin-bottom: 16px;
    }
    .stat {
      background: #16213e; padding: 10px;
      border-radius: 10px; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    .stat-icon { flex-shrink: 0; }
    .stat-body { flex: 1; text-align: left; }
    .stat-bar {
      height: 6px; background: #0f3460;
      border-radius: 3px; margin-top: 4px; overflow: hidden;
    }
    .stat-fill { height: 100%; transition: width 0.3s; }
    .buttons {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; width: 100%; max-width: 340px;
    }
    button {
      padding: 14px; border: none; border-radius: 12px;
      background: #e94560; color: white; font-size: 14px;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    @keyframes idle-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .pet-sprite {
      animation: idle-bob 2s ease-in-out infinite;
      display: block; margin: 0 auto;
    }
    @keyframes blink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0; }
    }
    .pet-sprite .eye { animation: blink 4s infinite; }
    @keyframes jump {
      0% { transform: translateY(0); }
      30% { transform: translateY(-20px); }
      60% { transform: translateY(0); }
      80% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    .pet-sprite.jump { animation: jump 0.6s ease; }
    @keyframes sleep-breath {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.03) rotate(-2deg); }
    }
    .pet-sprite.sleeping {
      animation: sleep-breath 3s ease-in-out infinite;
      filter: brightness(0.7);
    }
  </style>
</head>
<body>
  <div id="select-screen">
    <h2>Выбери питомца</h2>
    <div class="pets-grid"></div>
  </div>

  <div id="game-screen">
    <div class="coins">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <circle cx="12" cy="12" r="10" fill="#ffd700" stroke="#b8860b" stroke-width="1.5"/>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b">$</text>
      </svg>
      <span id="coins">100</span>
    </div>

    <div class="pet-container" id="pet-display"></div>

    <div class="stats">
      <div class="stat">
        <svg class="stat-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 2C8 2 5 5 5 9c0 3 1 5 2 7l2 4c.5 1 2 1 2.5 0l1-2h3l1 2c.5 1 2 1 2.5 0l2-4c1-2 2-4 2-7 0-4-3-7-7-7z" fill="#e76f51"/>
        </svg>
        <div class="stat-body">
          Голод
          <div class="stat-bar"><div class="stat-fill" id="hunger-bar" style="width:100%; background:#e76f51;"></div></div>
        </div>
      </div>
      <div class="stat">
        <svg class="stat-icon" viewBox="0 0 24 24" width="20" height="20">
          <circle cx="12" cy="12" r="10" fill="#ffd700"/>
          <circle cx="9" cy="10" r="1.5" fill="#000"/>
          <circle cx="15" cy="10" r="1.5" fill="#000"/>
          <path d="M8 14 Q12 18 16 14" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="stat-body">
          Счастье
          <div class="stat-bar"><div class="stat-fill" id="happiness-bar" style="width:100%; background:#ffd700;"></div></div>
        </div>
      </div>
      <div class="stat">
        <svg class="stat-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M13 2 L4 14 h6 l-1 8 L20 10 h-6 z" fill="#4dabf7"/>
        </svg>
        <div class="stat-body">
          Энергия
          <div class="stat-bar"><div class="stat-fill" id="energy-bar" style="width:100%; background:#4dabf7;"></div></div>
        </div>
      </div>
      <div class="stat">
        <svg class="stat-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 21s-8-5-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 6-8 11-8 11z" fill="#4CAF50"/>
        </svg>
        <div class="stat-body">
          Здоровье
          <div class="stat-bar"><div class="stat-fill" id="health-bar" style="width:100%; background:#4CAF50;"></div></div>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button onclick="action('feed')">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
          <path d="M12 2C8 2 5 5 5 9c0 3 1 5 2 7l2 4c.5 1 2 1 2.5 0l1-2h3l1 2c.5 1 2 1 2.5 0l2-4c1-2 2-4 2-7 0-4-3-7-7-7z" fill="#fff"/>
        </svg>
        Покормить
      </button>
      <button onclick="action('play')">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <circle cx="12" cy="12" r="10" fill="#fff"/>
          <path d="M4 8 Q12 12 20 8" stroke="#e94560" stroke-width="1.5" fill="none"/>
          <path d="M4 16 Q12 12 20 16" stroke="#e94560" stroke-width="1.5" fill="none"/>
        </svg>
        Поиграть
      </button>
      <button onclick="action('sleep')">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z" fill="#fff"/>
        </svg>
        Спать
      </button>
      <button onclick="action('heal')">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <rect x="3" y="6" width="18" height="14" rx="3" fill="#fff"/>
          <rect x="10" y="9" width="4" height="8" fill="#e94560"/>
          <rect x="7" y="11" width="10" height="4" fill="#e94560"/>
        </svg>
        Лечить
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const SPRITES = {
      cat: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="3" y="1" width="2" height="2" fill="#f4a261"/>
        <rect x="11" y="1" width="2" height="2" fill="#f4a261"/>
        <rect x="4" y="3" width="8" height="6" fill="#f4a261"/>
        <rect class="eye" x="5" y="5" width="1" height="1" fill="#000"/>
        <rect class="eye" x="10" y="5" width="1" height="1" fill="#000"/>
        <rect x="7" y="7" width="2" height="1" fill="#e76f51"/>
        <rect x="4" y="9" width="8" height="5" fill="#f4a261"/>
        <rect x="4" y="14" width="2" height="1" fill="#e76f51"/>
        <rect x="10" y="14" width="2" height="1" fill="#e76f51"/>
        <rect x="12" y="10" width="2" height="1" fill="#f4a261"/>
        <rect x="13" y="11" width="1" height="2" fill="#f4a261"/>
      </svg>`,
      dragon: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="0" y="4" width="2" height="4" fill="#f1c40f"/>
        <rect x="14" y="4" width="2" height="4" fill="#f1c40f"/>
        <rect x="4" y="1" width="1" height="2" fill="#f1c40f"/>
        <rect x="11" y="1" width="1" height="2" fill="#f1c40f"/>
        <rect x="4" y="3" width="8" height="6" fill="#e63946"/>
        <rect class="eye" x="5" y="5" width="1" height="1" fill="#fff"/>
        <rect class="eye" x="10" y="5" width="1" height="1" fill="#fff"/>
        <rect x="6" y="7" width="4" height="1" fill="#7a1a1a"/>
        <rect x="4" y="9" width="8" height="5" fill="#e63946"/>
        <rect x="4" y="14" width="2" height="1" fill="#f1c40f"/>
        <rect x="10" y="14" width="2" height="1" fill="#f1c40f"/>
        <rect x="12" y="10" width="2" height="1" fill="#e63946"/>
        <rect x="13" y="11" width="1" height="2" fill="#f1c40f"/>
      </svg>`,
      penguin: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="5" y="1" width="6" height="5" fill="#2c3e50"/>
        <rect class="eye" x="6" y="3" width="1" height="1" fill="#fff"/>
        <rect class="eye" x="9" y="3" width="1" height="1" fill="#fff"/>
        <rect x="7" y="4" width="2" height="1" fill="#f39c12"/>
        <rect x="4" y="6" width="8" height="8" fill="#2c3e50"/>
        <rect x="6" y="7" width="4" height="6" fill="#ecf0f1"/>
        <rect x="5" y="14" width="2" height="1" fill="#f39c12"/>
        <rect x="9" y="14" width="2" height="1" fill="#f39c12"/>
      </svg>`,
      fox: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="2" y="1" width="2" height="3" fill="#e67e22"/>
        <rect x="12" y="1" width="2" height="3" fill="#e67e22"/>
        <rect x="4" y="3" width="8" height="6" fill="#e67e22"/>
        <rect class="eye" x="5" y="5" width="1" height="1" fill="#000"/>
        <rect class="eye" x="10" y="5" width="1" height="1" fill="#000"/>
        <rect x="7" y="7" width="2" height="1" fill="#fff"/>
        <rect x="4" y="9" width="8" height="5" fill="#e67e22"/>
        <rect x="6" y="10" width="4" height="3" fill="#fff"/>
        <rect x="4" y="14" width="2" height="1" fill="#000"/>
        <rect x="10" y="14" width="2" height="1" fill="#000"/>
        <rect x="12" y="9" width="2" height="2" fill="#fff"/>
      </svg>`,
      turtle: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="3" y="6" width="10" height="6" fill="#27ae60"/>
        <rect x="5" y="7" width="2" height="2" fill="#2ecc71"/>
        <rect x="9" y="7" width="2" height="2" fill="#2ecc71"/>
        <rect x="6" y="3" width="4" height="3" fill="#27ae60"/>
        <rect class="eye" x="6" y="4" width="1" height="1" fill="#000"/>
        <rect class="eye" x="9" y="4" width="1" height="1" fill="#000"/>
        <rect x="3" y="12" width="2" height="2" fill="#27ae60"/>
        <rect x="11" y="12" width="2" height="2" fill="#27ae60"/>
        <rect x="1" y="8" width="2" height="1" fill="#27ae60"/>
        <rect x="13" y="8" width="2" height="1" fill="#27ae60"/>
      </svg>`
    };

    const PET_NAMES = { cat: "Кот", dragon: "Дракон", penguin: "Пингвин", fox: "Лиса", turtle: "Черепаха" };

    const state = { hunger: 100, happiness: 100, energy: 100, health: 100, coins: 100 };
    let selectedPet = null;

    function renderSelect() {
      const grid = document.querySelector('.pets-grid');
      grid.innerHTML = '';
      for (const key of Object.keys(SPRITES)) {
        const card = document.createElement('div');
        card.className = 'pet-card';
        card.innerHTML = `${SPRITES[key].replace('width="180" height="180"', 'width="100%" height="auto"')}<h3>${PET_NAMES[key]}</h3>`;
        card.onclick = () => selectPet(key);
        grid.appendChild(card);
      }
    }

    function selectPet(key) {
      selectedPet = key;
      localStorage.setItem('pet', key);
      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('pet-display').innerHTML = SPRITES[key];
      render();
    }

    function render() {
      document.getElementById('coins').textContent = state.coins;
      document.getElementById('hunger-bar').style.width = state.hunger + '%';
      document.getElementById('happiness-bar').style.width = state.happiness + '%';
      document.getElementById('energy-bar').style.width = state.energy + '%';
      document.getElementById('health-bar').style.width = state.health + '%';
    }

    function action(type) {
      const sprite = document.querySelector('.pet-sprite');
      if (type === 'feed') { state.hunger = Math.min(100, state.hunger + 30); state.coins += 1; }
      if (type === 'play') { state.happiness = Math.min(100, state.happiness + 25); state.energy = Math.max(0, state.energy - 15); state.coins += 2; }
      if (type === 'sleep') {
        state.energy = Math.min(100, state.energy + 50);
        sprite?.classList.add('sleeping');
        setTimeout(() => sprite?.classList.remove('sleeping'), 3000);
      }
      if (type === 'heal') { state.health = Math.min(100, state.health + 30); state.coins = Math.max(0, state.coins - 10); }
      if (type !== 'sleep') {
        sprite?.classList.add('jump');
        setTimeout(() => sprite?.classList.remove('jump'), 600);
      }
      render();
      if (tg) tg.HapticFeedback?.impactOccurred('light');
    }

    const saved = localStorage.getItem('pet');
    renderSelect();
    if (saved && SPRITES[saved]) selectPet(saved);
  </script>
</body>
</html>
