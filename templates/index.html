<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Пиксельные Питомцы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #1a1a2e; color: #fff;
      font-family: 'Courier New', monospace;
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* --- ЭКРАН ВЫБОРА --- */
    #select-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; padding: 20px; text-align: center; z-index: 100; background: #1a1a2e;
    }
    #select-screen h2 { margin-bottom: 20px; font-size: 22px; }
    .pets-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 340px;
    }
    .pet-card {
      background: #16213e; border: 3px solid #0f3460; border-radius: 14px; padding: 10px;
      cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .pet-card:hover { border-color: #e94560; transform: scale(1.02); }
    .pet-card svg { width: 100%; height: auto; image-rendering: pixelated; }
    .pet-card h3 { font-size: 14px; margin-top: 5px; }

    /* --- ИГРОВОЙ ЭКРАН --- */
    #game-screen { display: none; flex-direction: column; height: 100%; position: relative; }

    /* Верхняя панель */
    .top-bar {
      position: absolute; top: 15px; left: 0; width: 100%;
      display: flex; justify-content: space-between; padding: 0 15px; z-index: 10;
    }
    .coins, .level {
      background: rgba(0, 0, 0, 0.6); padding: 6px 14px; border-radius: 20px;
      font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(4px);
    }
    .coins { border: 2px solid #ffd700; color: #ffd700; }
    .level { border: 2px solid #4dabf7; color: #4dabf7; }

    /* Игровое поле */
    .game-world {
      flex: 1; position: relative; overflow: hidden;
      background-color: #2c1b18; image-rendering: pixelated;
    }
    
    /* Пиксельный фон */
    .room-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(transparent 50%, rgba(0,0,0,0.15) 50%),
        linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.15) 50%);
      background-size: 20px 20px; z-index: 1;
    }
    .room-window {
      position: absolute; top: 12%; left: 10%;
      width: 80px; height: 100px; background: #87CEEB;
      border: 4px solid #5a3a29; border-radius: 4px;
      box-shadow: inset 0 0 0 2px #87CEEB, inset 0 0 10px rgba(0,0,0,0.3);
      z-index: 2;
    }
    .room-window::after {
      content: ''; position: absolute; top: 50%; left: 0;
      width: 100%; height: 4px; background: #5a3a29; transform: translateY(-50%);
    }
    .room-window::before {
      content: ''; position: absolute; top: 0; left: 50%;
      width: 4px; height: 100%; background: #5a3a29; transform: translateX(-50%);
    }
    .room-carpet {
      position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
      width: 200px; height: 60px; background: #a0522d;
      border: 4px solid #8b4513; border-radius: 50%; z-index: 2;
    }

    /* Зверь */
    .pet-container {
      position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
      z-index: 5; cursor: pointer;
    }
    .pet-container svg { display: block; image-rendering: pixelated; filter: drop-shadow(0 10px 5px rgba(0,0,0,0.5)); }
    
    /* Анимации */
    @keyframes idle-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .pet-sprite { animation: idle-bob 2.5s ease-in-out infinite; }
    
    @keyframes blink {
      0%, 92%, 100% { opacity: 1; }
      95% { opacity: 0; }
    }
    .pet-sprite .eye { animation: blink 4s infinite; }
    
    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-35px); }
      60% { transform: translateY(0); }
      80% { transform: translateY(-10px); }
    }
    .pet-sprite.jump { animation: jump 0.6s ease; }
    
    @keyframes sleep-breath {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(-3deg); }
    }
    .pet-sprite.sleeping { animation: sleep-breath 3s ease-in-out infinite; filter: brightness(0.6); }

    /* Всплывающий текст (Реакция) */
    .popup-text {
      position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
      background: white; color: black; padding: 5px 10px; border-radius: 10px;
      font-weight: bold; font-size: 14px; opacity: 0; pointer-events: none;
      transition: all 0.3s; border: 2px solid black; white-space: nowrap;
    }
    .popup-text.show { opacity: 1; top: -60px; }

    /* Нижний интерфейс */
    .ui-panel {
      background: #16213e; border-top: 4px solid #0f3460;
      padding: 15px; border-radius: 20px 20px 0 0;
      z-index: 10; box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
    }
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;
    }
    .stat { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .stat-bar { flex: 1; height: 8px; background: #0f3460; border-radius: 4px; overflow: hidden; }
    .stat-fill { height: 100%; transition: width 0.3s; }
    
    .buttons-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    }
    button {
      padding: 12px 5px; border: none; border-radius: 10px;
      background: #e94560; color: white; font-size: 12px;
      font-family: inherit; font-weight: bold; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    button svg { width: 24px; height: 24px; fill: white; }
    button.shop-btn { background: #f39c12; }
    button.donate-btn { background: #9b59b6; }

    /* Модальное окно магазина */
    #shop-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 100;
      flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .shop-content {
      background: #16213e; border: 4px solid #0f3460; border-radius: 16px;
      width: 100%; max-width: 340px; padding: 20px; text-align: center;
    }
    .shop-content h2 { margin-bottom: 15px; color: #ffd700; }
    .shop-item {
      background: #1a1a2e; padding: 10px; margin-bottom: 10px;
      border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .shop-item button { padding: 8px 12px; flex-direction: row; font-size: 12px; }
    .close-btn { background: #e74c3c; margin-top: 10px; width: 100%; padding: 12px; flex-direction: row; justify-content: center; }
  </style>
</head>
<body>

  <!-- ЭКРАН ВЫБОРА -->
  <div id="select-screen">
    <h2>Выбери питомца</h2>
    <div class="pets-grid">
      <!-- Карточки будут добавлены через JS -->
    </div>
  </div>

  <!-- ИГРОВОЙ ЭКРАН -->
  <div id="game-screen">
    <div class="top-bar">
      <div class="coins">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10" fill="#ffd700" stroke="#b8860b" stroke-width="2"/></svg>
        <span id="coins">100</span>
      </div>
      <div class="level">Ур. <span id="level">1</span></div>
    </div>

    <div class="game-world">
      <div class="room-bg"></div>
      <div class="room-window"></div>
      <div class="room-carpet"></div>
      
      <!-- Зверь -->
      <div class="pet-container" id="pet-display" onclick="petReact()">
        <div class="popup-text" id="popup-text">Привет!</div>
      </div>
    </div>

    <!-- ИНТЕРФЕЙС -->
    <div class="ui-panel">
      <div class="stats-grid">
        <div class="stat"><span>🍖</span><div class="stat-bar"><div class="stat-fill" id="hunger-bar" style="width:100%; background:#e76f51;"></div></div></div>
        <div class="stat"><span>😊</span><div class="stat-bar"><div class="stat-fill" id="happiness-bar" style="width:100%; background:#ffd700;"></div></div></div>
        <div class="stat"><span>⚡</span><div class="stat-bar"><div class="stat-fill" id="energy-bar" style="width:100%; background:#4dabf7;"></div></div></div>
        <div class="stat"><span>❤️</span><div class="stat-bar"><div class="stat-fill" id="health-bar" style="width:100%; background:#4CAF50;"></div></div></div>
      </div>

      <div class="buttons-grid">
        <button onclick="action('feed')"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 3 1 5 2 7l2 4c.5 1 2 1 2.5 0l1-2h3l1 2c.5 1 2 1 2.5 0l2-4c1-2 2-4 2-7 0-4-3-7-7-7z"/></svg>Кормить</button>
        <button onclick="action('play')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M4 8 Q12 12 20 8" stroke="#e94560" stroke-width="2" fill="none"/></svg>Играть</button>
        <button onclick="action('sleep')"><svg viewBox="0 0 24 24"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg>Спать</button>
      </div>
      <div class="buttons-grid" style="margin-top: 10px;">
        <button class="shop-btn" onclick="openShop()"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>Магазин</button>
        <button class="donate-btn" onclick="openDonate()" style="grid-column: span 2;"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Донат / Stars</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО МАГАЗИНА -->
  <div id="shop-modal">
    <div class="shop-content">
      <h2>🛒 Магазин</h2>
      <div class="shop-item"><span>🍎 Вкусная еда</span><button onclick="buyItem(10, 'hunger', 50)">10 монет</button></div>
      <div class="shop-item"><span>🎾 Игрушка</span><button onclick="buyItem(20, 'happiness', 30)">20 монет</button></div>
      <div class="shop-item"><span>💊 Лекарство</span><button onclick="buyItem(15, 'health', 40)">15 монет</button></div>
      <button class="close-btn" onclick="closeShop()">Закрыть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    // --- ЗВЕРЬКИ (Уникальные образы) ---
    const SPRITES = {
      cat: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="3" y="1" width="2" height="2" fill="#f4a261"/><rect x="11" y="1" width="2" height="2" fill="#f4a261"/>
        <rect x="4" y="3" width="8" height="6" fill="#f4a261"/>
        <rect class="eye" x="5" y="5" width="1" height="1" fill="#000"/><rect class="eye" x="10" y="5" width="1" height="1" fill="#000"/>
        <rect x="7" y="7" width="2" height="1" fill="#e76f51"/>
        <rect x="4" y="9" width="8" height="5" fill="#f4a261"/>
        <rect x="4" y="14" width="2" height="1" fill="#e76f51"/><rect x="10" y="14" width="2" height="1" fill="#e76f51"/>
        <rect x="12" y="10" width="2" height="1" fill="#f4a261"/><rect x="13" y="11" width="1" height="2" fill="#f4a261"/>
      </svg>`,
      dragon: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="0" y="4" width="2" height="4" fill="#f1c40f"/><rect x="14" y="4" width="2" height="4" fill="#f1c40f"/>
        <rect x="4" y="1" width="1" height="2" fill="#f1c40f"/><rect x="11" y="1" width="1" height="2" fill="#f1c40f"/>
        <rect x="4" y="3" width="8" height="6" fill="#e63946"/>
        <rect class="eye" x="5" y="5" width="1" height="1" fill="#fff"/><rect class="eye" x="10" y="5" width="1" height="1" fill="#fff"/>
        <rect x="6" y="7" width="4" height="1" fill="#7a1a1a"/>
        <rect x="4" y="9" width="8" height="5" fill="#e63946"/>
        <rect x="4" y="14" width="2" height="1" fill="#f1c40f"/><rect x="10" y="14" width="2" height="1" fill="#f1c40f"/>
        <rect x="12" y="10" width="2" height="1" fill="#e63946"/><rect x="13" y="11" width="1" height="2" fill="#f1c40f"/>
      </svg>`,
      penguin: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="5" y="1" width="6" height="5" fill="#2c3e50"/>
        <rect class="eye" x="6" y="3" width="1" height="1" fill="#fff"/><rect class="eye" x="9" y="3" width="1" height="1" fill="#fff"/>
        <rect x="7" y="4" width="2" height="1" fill="#f39c12"/>
        <rect x="4" y="6" width="8" height="8" fill="#2c3e50"/>
        <rect x="6" y="7" width="4" height="6" fill="#ecf0f1"/>
        <rect x="5" y="14" width="2" height="1" fill="#f39c12"/><rect x="9" y="14" width="2" height="1" fill="#f39c12"/>
      </svg>`,
      fox: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="2" y="1" width="2" height="3" fill="#e67e22"/><rect x="12" y="1" width="2" height="3" fill="#e67e22"/>
        <rect x="4" y="3" width="8" height="6" fill="#e67e22"/>
        <rect class="eye" x="5" y="5" width="1" height="1" fill="#000"/><rect class="eye" x="10" y="5" width="1" height="1" fill="#000"/>
        <rect x="7" y="7" width="2" height="1" fill="#fff"/>
        <rect x="4" y="9" width="8" height="5" fill="#e67e22"/>
        <rect x="6" y="10" width="4" height="3" fill="#fff"/>
        <rect x="4" y="14" width="2" height="1" fill="#000"/><rect x="10" y="14" width="2" height="1" fill="#000"/>
        <rect x="12" y="9" width="2" height="2" fill="#fff"/>
      </svg>`,
      turtle: `<svg class="pet-sprite" viewBox="0 0 16 16" width="180" height="180" shape-rendering="crispEdges">
        <rect x="3" y="6" width="10" height="6" fill="#27ae60"/>
        <rect x="5" y="7" width="2" height="2" fill="#2ecc71"/><rect x="9" y="7" width="2" height="2" fill="#2ecc71"/>
        <rect x="6" y="3" width="4" height="3" fill="#27ae60"/>
        <rect class="eye" x="6" y="4" width="1" height="1" fill="#000"/><rect class="eye" x="9" y="4" width="1" height="1" fill="#000"/>
        <rect x="3" y="12" width="2" height="2" fill="#27ae60"/><rect x="11" y="12" width="2" height="2" fill="#27ae60"/>
        <rect x="1" y="8" width="2" height="1" fill="#27ae60"/><rect x="13" y="8" width="2" height="1" fill="#27ae60"/>
      </svg>`
    };

    const PET_NAMES = { cat: "Кот", dragon: "Дракон", penguin: "Пингвин", fox: "Лиса", turtle: "Черепаха" };
    const PET_SOUNDS = { cat: "Мяу!", dragon: "Ррр!", penguin: "Пинг!", fox: "Тяв!", turtle: "Шшш..." };

    let currentPet = null;
    const state = { hunger: 100, happiness: 100, energy: 100, health: 100, coins: 100 };

    // Рендер экрана выбора
    function renderSelect() {
      const grid = document.querySelector('.pets-grid');
      grid.innerHTML = '';
      for (const key of Object.keys(SPRITES)) {
        const card = document.createElement('div');
        card.className = 'pet-card';
        card.innerHTML = `${SPRITES[key].replace('width="180" height="180"', 'width="100%" height="auto"')}<h3>${PET_NAMES[key]}</h3>`;
        card.onclick = () => selectPet(key);
        grid.appendChild(card);
      }
    }

    function selectPet(key) {
      currentPet = key;
      localStorage.setItem('pet', key);
      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      
      // Вставляем спрайт зверя, сохраняя всплывающий текст
      const display = document.getElementById('pet-display');
      display.innerHTML = SPRITES[key] + `<div class="popup-text" id="popup-text">${PET_SOUNDS[key]}</div>`;
      
      render();
    }

    function render() {
      document.getElementById('coins').textContent = state.coins;
      document.getElementById('hunger-bar').style.width = state.hunger + '%';
      document.getElementById('happiness-bar').style.width = state.happiness + '%';
      document.getElementById('energy-bar').style.width = state.energy + '%';
      document.getElementById('health-bar').style.width = state.health + '%';
    }

    // Реакция на клик по питомцу
    function petReact() {
      const sprite = document.querySelector('.pet-sprite');
      const popup = document.getElementById('popup-text');
      
      sprite?.classList.remove('jump');
      void sprite?.offsetWidth; // Перезапуск анимации
      sprite?.classList.add('jump');
      
      if(popup) {
        popup.classList.add('show');
        setTimeout(() => popup.classList.remove('show'), 800);
      }

      state.happiness = Math.min(100, state.happiness + 2); 
      render();
      if (tg) tg.HapticFeedback?.impactOccurred('medium');
    }

    function action(type) {
      const sprite = document.querySelector('.pet-sprite');
      if (type === 'feed') { state.hunger = Math.min(100, state.hunger + 30); state.coins += 1; }
      if (type === 'play') { state.happiness = Math.min(100, state.happiness + 25); state.energy = Math.max(0, state.energy - 15); state.coins += 2; }
      if (type === 'sleep') {
        state.energy = Math.min(100, state.energy + 50);
        sprite?.classList.add('sleeping');
        setTimeout(() => sprite?.classList.remove('sleeping'), 4000);
      }
      
      if (type !== 'sleep') {
        sprite?.classList.remove('jump');
        void sprite?.offsetWidth;
        sprite?.classList.add('jump');
        setTimeout(() => sprite?.classList.remove('jump'), 600);
      }
      render();
      if (tg) tg.HapticFeedback?.impactOccurred('light');
    }

    function openShop() { document.getElementById('shop-modal').style.display = 'flex'; }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

    function buyItem(price, stat, amount) {
      if (state.coins >= price) {
        state.coins -= price;
        state[stat] = Math.min(100, state[stat] + amount);
        render();
        if (tg) tg.HapticFeedback?.notificationOccurred('success');
      } else {
        alert("Недостаточно монет!");
      }
    }

    function openDonate() {
      if (tg) {
        tg.showPopup({
          title: "Донат / Stars",
          message: "Здесь можно будет купить украшения для зверька за Telegram Stars!",
          buttons: [{ type: "ok" }]
        });
      }
    }

    // Инициализация
    renderSelect();
    const saved = localStorage.getItem('pet');
    if (saved && SPRITES[saved]) selectPet(saved);
  </script>
</body>
</html>
